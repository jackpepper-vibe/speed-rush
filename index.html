<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Speed Rush</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #05060a; overflow: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    #stage { display: block; width: 100vw; height: 100vh; }
    #boot {
      position: fixed; inset: 0; display: grid; place-content: center;
      gap: 14px; justify-items: center; color: #6b7280;
      letter-spacing: 0.32em; font-size: 11px; text-transform: uppercase;
    }
    #boot .bar { width: 160px; height: 2px; background: #1a1d24; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: #ff5a2c; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="boot"><span>Speed Rush</span><span class="bar"><i></i></span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
